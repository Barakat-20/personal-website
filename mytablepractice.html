<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Practice</title>
    <link rel="stylesheet" href="styletable.css">
</head>
<body>
  <div>
  <table id="class" border="1" cellpadding="10" 
   cellspacing="0" border-width= "3px" table-layout="fixed">
   
    <tr align="centre" id="header">
      <th>Operator</th>
      <th>Javascript/
        <br>Python</th>
    </tr>
    <tr align="centre">
      <td id="dd">Addition</td>
      <td id="sign"> + </td>
    </tr>
    <tr align="centre">
      <td>Subraction</td>
      <td id="sign"> - </td>
    </tr>
      <tr align="centre">
      <td>Multiplication</td>
      <td id="sign"> * </td>
    </tr>
      <tr align="centre">
      <td>Division</td>
      <td id="sign"> / </td>
    </tr>
      <tr align="centre">
      <td>Bracket Priority</td>
      <td id="sign"> () </td>
    </tr>
      <tr align="centre">
      <td>Modulus(returns the<br> remainder of a division)</td>
      <td id="sign"> % </td>
    </tr>
  </table>
   <caption><p id="c">MATHEMATICAL OPERATORS</p></caption>
  </div>
  
  
</body>
</html>
